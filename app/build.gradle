plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.labd.raster'
    compileSdk 34

    defaultConfig {
        applicationId "ru.labd.raster"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
